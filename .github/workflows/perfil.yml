name: Atualizar widgets do perfil

on:
  schedule:
    - cron: "0 6 * * *" # 3h em São Paulo
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["profile/**", "profile-3d-contrib/**"]

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Estatísticas (escuro)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&locale=pt-br&show_icons=true&rank_icon=github&include_all_commits=true&border_radius=12&bg_color=0D1117&border_color=30363D&title_color=58A6FF&icon_color=58A6FF&text_color=C9D1D9&ring_color=58A6FF
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Estatísticas (claro)
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&locale=pt-br&show_icons=true&rank_icon=github&include_all_commits=true&border_radius=12&bg_color=FFFFFF&border_color=D0D7DE&title_color=0969DA&icon_color=0969DA&text_color=1F2328&ring_color=0969DA
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Streak (cópia local)
        run: |
          mkdir -p profile
          baixar() {
            tmp=$(mktemp)
            if curl -fsSL --max-time 60 "$1" -o "$tmp" && grep -q "<svg" "$tmp" && ! grep -qiE "went wrong|not found|error fetching" "$tmp"; then
              mv "$tmp" "$2"
            else
              echo "::warning::Streak indisponível, mantendo a versão anterior de $2"
            fi
          }
          BASE="https://streak-stats.demolab.com/?user=${{ github.repository_owner }}&locale=pt_BR&timezone=America/Sao_Paulo&mode=weekly&border_radius=12"
          baixar "$BASE&background=0D1117&border=30363D&stroke=30363D&ring=58A6FF&fire=58A6FF&currStreakNum=E6EDF3&sideNums=E6EDF3&currStreakLabel=58A6FF&sideLabels=8B949E&dates=8B949E" profile/streak-dark.svg
          baixar "$BASE&background=FFFFFF&border=D0D7DE&stroke=D0D7DE&ring=0969DA&fire=0969DA&currStreakNum=1F2328&sideNums=1F2328&currStreakLabel=0969DA&sideLabels=656D76&dates=656D76" profile/streak-light.svg

      - name: Gráfico 3D
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-contrib.json

      - name: Cobrinha
        uses: Platane/snk/svg-only@v3
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/snake-dark.svg?palette=github-dark&color_snake=#58A6FF&color_dots=#161B22,#0D419D,#1F6FEB,#388BFD,#79C0FF
            profile/snake-light.svg?palette=github-light&color_snake=#0969DA&color_dots=#EBEDF0,#B6E3FF,#54AEFF,#0969DA,#0A3069

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -m "chore: atualiza widgets do perfil"
          git pull --rebase && git push
